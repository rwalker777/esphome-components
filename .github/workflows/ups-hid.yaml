name: UPS HID
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/ups_hid/test_descriptor.cpp -o /tmp/ups-test
      - run: /tmp/ups-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Itests/ups_hid/stubs tests/ups_hid/test_control_transfer.cpp -o /tmp/ups-control-test
      - run: /tmp/ups-control-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address,undefined -g -Itests/ups_hid/stubs tests/ups_hid/test_recovery.cpp components/ups_hid/ups_hid.cpp -o /tmp/ups-recovery-test
      - run: /tmp/ups-recovery-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-class-memaccess -DUSE_ESP32 -fsanitize=address,undefined -g -Itests/ups_hid/stubs tests/ups_hid/test_transport_recovery.cpp components/ups_hid/transport_esp32.cpp -o /tmp/ups-transport-recovery-test
      - run: /tmp/ups-transport-recovery-test
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install esphome==2026.10.1
      - run: python tests/ups_hid/test_sensor_config.py
      - run: esphome compile tests/ups_hid/firmware.yaml
