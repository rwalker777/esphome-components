    type: battery_status
    name: "${ups_name} Battery Status"

  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: ups_beeper_status
    id: ups_beeper_status
    name: "${ups_name} Beeper Status"
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: ups_test_result
    name: "${ups_name} Self Test Result"
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: firmware_version
    name: "${ups_name} Firmware Version Raw"
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: ups_firmware_aux
    name: "${ups_name} Protocol Version Raw"
    entity_category: diagnostic

select:
  - platform: template
    name: "${ups_name} Beeper Mode"
    entity_category: config
    icon: mdi:volume-high
    options:
      - Disabled
      - Enabled
      - Muted
    optimistic: false
    # Check cached device readback; this does not add USB polls.
    update_interval: 1s
    lambda: |-
      const auto &mode = id(ups_beeper_status).state;
      if (mode == "disabled") return std::string("Disabled");
      if (mode == "enabled") return std::string("Enabled");
      if (mode == "muted") return std::string("Muted");
      return {};  // Status text shows Unknown; retain the last known option.
    set_action:
      - lambda: |-
          bool sent = false;
          if (x == "Disabled") sent = id(ups_monitor).beeper_disable();
          else if (x == "Enabled") sent = id(ups_monitor).beeper_enable();
          else if (x == "Muted") sent = id(ups_monitor).beeper_mute();
          if (!sent)
            ESP_LOGW("ups_hid", "Could not set UPS beeper mode; check device readback");

button:
  - platform: restart
    id: ups_restart_monitor
    name: "${ups_name} Restart Monitor"
    entity_category: config
  - platform: ups_hid
    ups_hid_id: ups_monitor
    test_action: battery_quick
