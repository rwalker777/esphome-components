# Complete UPS configuration for descriptor-based Tripp Lite 09AE:3024 devices.
# Keep board, networking, API/OTA and any board LED in the device configuration.
substitutions:
  ups_name: UPS
  ups_update_interval: 5s
  ups_diagnostic_dump: "false"
  ups_component_source: github://kevin-david/esphome-components@main

external_components:
  - source: ${ups_component_source}
    refresh: 0s
    components: [ups_hid]

# Native USB is the host connection; send logs over UART0 instead.
logger:
  hardware_uart: UART0
  level: INFO

ups_hid:
  id: ups_monitor
  protocol: tripplite
  update_interval: ${ups_update_interval}
  diagnostic_dump: ${ups_diagnostic_dump}

sensor:
